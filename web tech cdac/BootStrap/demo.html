<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .myimg {
            width: 200px;
            height: 200px;
        }
        
    </style>
</head>
<body>
    <div class="container mt-3">

    <button type="button" class="btn btn-outline-primary">Press Me</button>
    <button type="button" class="btn btn-outline-primary btn-sm">Press Me</button>
    <button type="button" class="btn btn-outline-primary btn-lg">Press Me</button>

    <div class="d-grid">
    <button type="button" class="btn btn-outline-primary btn-lg">Press Me</button>
    </div>

    <span class="spinner-border text-warning"></span>

    <button type="button" class="bg-info">
        <span class="spinner-border text-warning spinner-border-sm"></span>Loading...
    </button>
    <span class="spinner-grow text-info"></span>

    <div class="display-1">First Bootrap session</div>
    <div class="display-2">First Bootrap session</div>
    <div class="display-3">First Bootrap session</div>
    <div class="display-4">First Bootrap session</div>
    <div class="display-5">First Bootrap session</div>
    <div class="display-6">First Bootrap session</div>
    <div class="small">First Bootrap session</div>
    </div>

    <div class="container mt-3">
        <img class="myimg rounded " src="../assets/gulab jamun types/chocolate gulab jamun.jpg" alt="chocolate gulab jamun">
        <img class="myimg img-thumbnail" src="../assets/gulab jamun types/rabdi gulab jamun.jpg" alt="rabdi gulab jamun">
        <img class="myimg rounded-circle" src="../assets/gulab jamun types/rose gulab jamun.jpg" alt="rose gulab jamun">
        <img class="myimg" src="../assets/gulab jamun types/coconut gulab jamun.jpg" alt="coconut gulab jamun">
    </div>

    <h2 class="text-primary">AMAN DESIGN</h2>
    <h2 class="text-secondary">AMAN DESIGN</h2>
    <h2 class="text-info">AMAN DESIGN</h2>
    <h2 class="text-muted">AMAN DESIGN</h2>
    <h2 class="text-dark">AMAN DESIGN</h2>
    <h2 class="text-success">AMAN DESIGN</h2>
    <h2 class="text-warning bg-info">AMAN DESIGN</h2>
    <h2 class="text-danger bg-warning">AMAN DESIGN</h2>
    
</body>
</html>
