<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container mt-2">
        <form class="was-validated">
            <div class="form-group">
                <label for="uname" class="form-label">Enter Your name</label>
                <input type="text" name="fname" id="uname" class="form-control" required>
                <span class="valid-feedback">Valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>


            <div class="form-group">
                <label for="pass" class="form-label">Enter Your Password</label>
                <input type="password" name="pass" id="pass" class="form-control" required>

                <span class="valid-feedback">Valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>

             <div class="form-group">
                <label for="email" class="form-label">Enter Your Email</label>
                <input type="email" name="mail" id="email" class="form-control" required>

                <span class="valid-feedback">Valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>

             <div class="form-group">
                <label for="contact" class="form-label">Enter Your Contact</label>
                <input type="tel" name="contact" id="contact" class="form-control" required>

                <span class="valid-feedback">Valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>

             <div class="form-group">
                <label for="gender" class="form-check-label">
                <input type="radio" name="gender" value="female" id="gender" class="form-check-input" required>
                male
                </label>
                <label for="gender" class="form-check-label">
                <input type="radio" name="gender" id="gender" value="female" class="form-check-input" required>
                female
                </label>
                <span class="valid-feedback">Valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>


             <div class="form-group">
                <label for="gender" class="form-label">select your course:  </label>
                <select name="corse" id="" class="form-control" required>
                    <option value="">select your course</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JS">JS</option>
                </select>
                
                <span class="valid-feedback">Valid data inserted</span>
                <span class="invalid-feedback">Invalid data inserted</span>
            </div>




        </form>

        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</body>

</html>
