<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

        <div class="row">
            <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 div-border">col-1</div>

            <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 div-border">col-3</div>
            <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 div-border">col-4</div>
            <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 div-border">col-5</div>
            <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 div-border">col-6</div>

        </div>
    </div>

</html>
