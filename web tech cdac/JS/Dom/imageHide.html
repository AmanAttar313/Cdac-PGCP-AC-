<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
                text-align: center;
        }
        
    </style>
</head>
<body>
    <div id="box">
        <img src="../../assets/samsung s 26.jpg" id="img1"><br><br>
        <button type="button" onclick="image('none')">Hide</button>
        <button type="button" onclick="image('inline')">Show</button>

    </div>

    <script>
        function image(val){

        document.getElementById("img1").style.display=val;
        document.getElementById("img1").style.display=val;

        }

    </script>
</body>
</html>
