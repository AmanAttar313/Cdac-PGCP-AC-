<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>
    <div id="d7"></div>
    <div id="d8"></div>
    <div id="d9"></div>
    <div id="d10"></div>
    <div id="d11"></div>

    <!-- Extra divs -->
    <div id="d12"></div>
    <div id="d13"></div>
    <div id="d14"></div>
    <div id="d15"></div>
    <div id="d16"></div>
    <div id="d17"></div>
    <div id="d18"></div>
    <div id="d19"></div>
    <div id="d20"></div>
    <div id="d21"></div>
    <div id="d22"></div>


    <script>
        let msg="You All are good Students,Your are bright Students";

        document.getElementById("d1").innerHTML=msg;
        document.getElementById("d2").innerHTML=msg.length;
        document.getElementById("d3").innerHTML=msg.toUpperCase();
        document.getElementById("d4").innerHTML=msg.toLowerCase();

        //index of
        document.getElementById("d5").innerHTML=msg.indexOf("Students");
        document.getElementById("d6").innerHTML=msg.indexOf("Students",20);

        //last index
        document.getElementById("d7").innerHTML=msg.lastIndexOf("Students");
        document.getElementById("d8").innerHTML=msg.lastIndexOf("Students",20);

        //search
        document.getElementById("d9").innerHTML=msg.search("good");

        //slice
        document.getElementById("d10").innerHTML=msg.slice(5);
        document.getElementById("d11").innerHTML=msg.slice(5,20);
        document.getElementById("d12").innerHTML=msg.slice(-10);
        document.getElementById("d13").innerHTML=msg.slice(-10,-2);

        //substringslice
        document.getElementById("d14").innerHTML=msg.substring(5);
        document.getElementById("d15").innerHTML=msg.substring(5,15);

        //substr
        document.getElementById("d16").innerHTML=msg.substr(5,6);

        // charAt
        document.getElementById("d17").innerHTML=msg.charAt(5);

        //replace
        document.getElementById("d18").innerHTML=msg.replace("Students","friends");
        document.getElementById("d19").innerHTML=msg.replace(/Students/g,"friends");
        document.getElementById("d20").innerHTML=msg.replace(/Students/ig,"friends");

        // replace all
        document.getElementById("d21").innerHTML=msg.replaceAll("Students","Friends");

        // concat
        document.getElementById("d22").innerHTML=msg.concat(" Welcome to JavaScript");

    </script>
</body>
</html>
