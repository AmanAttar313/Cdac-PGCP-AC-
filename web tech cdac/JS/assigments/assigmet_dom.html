<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="formid">
        <label for="">Enter You want</label><br>
        <input type="text" id="inputdata"><br>
        <button type="button" onclick="add()">Submit</button>

    </form>

    <ul id="uladd">

    </ul>

    <script>
        function add() {
            let inputData = document.getElementById("inputdata").value;
            let ul = document.getElementById("uladd");
            let newli = document.createElement("li");
            newli.innerText = inputData;
            ul.appendChild(newli);
        }
    </script>
</body>

</html>
