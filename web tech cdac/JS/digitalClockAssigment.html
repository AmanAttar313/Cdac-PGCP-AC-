<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="d1"></div>

     <script>
     //digital clock
        function myClock(){
            let obj=new Date();
            document.getElementById("d1").innerHTML=obj.toLocaleTimeString();
        }

        //my clock 
        setInterval(myClock,1000);
        </script>
</body>
</html>
