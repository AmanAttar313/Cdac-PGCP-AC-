<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=+, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Gst calvulator</h3>
    <input type="number" id="amount">
    <input type="number" id="gst">
    <button onclick="calculateGst()">calculate gst</button>

    <div id="result"></div>

    <script>
        function calculateGst(){
            let input=Number(document.getElementById("amount").value);
            let gst=Number(document.getElementById("gst").value);

            let gstcal=(gst*input)/100;
            let total =gstcal+input;
            
            document.getElementById("result").innerHTML=
            "GST amount="+ gstcal.toFixed(2)+
            "<br> total amount ="+total.toFixed(2);
            
        }
    </script>
</body>
</html>
