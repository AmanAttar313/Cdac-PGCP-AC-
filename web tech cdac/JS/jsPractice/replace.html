<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea name="" id="text" placeholder="Enter text"></textarea>
    
    <input type="text" id="find" placeholder="">
    <input type="text" id="replaceword">
    <button onClick="replaceone()">Replace One</button>
    <button onClick="replaceAll()">ReplaceAll</button>
    <div id="result"></div>
    <script>
        function replaceone(){
            let text=document.getElementById("text").value;
            let find=document.getElementById("find").value;
            let replace=document.getElementById("replaceword").value;
            let result=text.replace(find,replace);
            document.getElementById("result").innerText=result;
        }
         function replaceAll(){
            let text=document.getElementById("text").value;
            let find=document.getElementById("find").value;
            let replace=document.getElementById("replaceword").value;
            let result=text.replaceAll(find,replace);
            document.getElementById("result").innerText=result;
        }
    </script>
</body>
</html>
