<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tempreature Converter</h2>
    <input type="number" id="temp" placeholder="Enter Tempreature">

    <Select id="conversion">
        <option value="CtoF">
            Celcius to farenite
        </option>
        <option value="FtoC">
            Farenite to celcius
        </option>
    </Select>

    <button onClick="Covert()">Covert</button>
    <div id="result"></div>

    <script>
        function Covert(){
            let temp=Number(document.getElementById("temp").value);
            let type=document.getElementById("conversion").value;
            let result;
            if(type=="CtoF"){
                result=(temp*9/5)+32;
                document.getElementById("result").innerText=temp+" C"+result.toFixed(2)+" F";
            }else{
                result=(temp-32)*5/9;
                document.getElementById("result").innerText=temp+" C"+result.toFixed(2)+" F";
            }
        }
    </script>
</body>
</html>
