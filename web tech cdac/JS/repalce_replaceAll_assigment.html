<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="text">


    </div>

    <form action="">
        <textarea name="" id="oldText">old</textarea>
        <textarea name="" id="newText">new</textarea>
        <button type="button" onclick="replace()">Replace</button>
        <button type="button ">Replace All</button>
    </form>
    <script>
        function replace(){
        

        let text=document.getElementById("text").value;
        let oldtext=document.getElementById("oldText").value;
        let newText=document.getElementById("newText").value;


        document.getElementById("text").replace(oldtext,newText);
        
       

       
}
        </script>
   
</body>
</html>
