<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h4>table</h4>
    <table width="50%" border="10px">
        <thead>
            <tr>
                <th>roll no</th>
                <th>Name</th>
                <th>address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>Mumbai</td>

            </tr>
            <tr>
                <td>2</td>
                <td>Don</td>
                <td>pune</td>

            </tr>
            <tr>
                <td>3</td>
                <td>Babu</td>
                <td>Pune</td>
            </tr>
        </tbody>
    </table>


    <!-- ROW SPAN AND COLSPAN -->
    <h4> ROW SPAN</h4>
    <table width="50%" border="10px">
        <thead>
            <tr>
                <th>roll no</th>
                <th>Name</th>
                <th>address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td rowspan="2">Aman</td>
                <td>Mumbai</td>

            </tr>
            <tr>
                <td>2</td>

                <td>pune</td>

            </tr>

        </tbody>
    </table>

    <h4> col SPAN</h4>
    <table width="50%" border="10px">
        <thead>
            <tr>
                <th>roll no</th>
                <th>Name</th>
                <th>address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>Mumbai</td>

            </tr>
            <tr>
                <td colspan="2">2</td>
                <td>satara</td>

            </tr>

        </tbody>
    </table>

    <h4>row span and col span both at time</h4>
    <table width="50%" border="5px">

        <tr>
            <td rowspan="2" colspan="2">A</td>
            <td>B</td>
        </tr>

        <tr>
            <td>c</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Don</td>
            <td>pune</td>
        </tr>

        
    </table>



</body>

</html>
